@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

.app{
  --ink:#14211C; --ink-2:#4C5A54; --dim:#8A948F;
  --paper:#F1F4F0; --card:#FFFFFF; --line:#DFE5E0;
  --green:#0E6B4B; --green-d:#0A5239; --red:#C0453A;
  font-family:'IBM Plex Sans KR',system-ui,sans-serif;
  color:var(--ink); background:var(--paper);
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
.app *{box-sizing:border-box}
.app button{font-family:inherit;cursor:pointer}
.app :focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important;animation:none!important}}

.dim{color:var(--dim)}
.pad{padding:32px 20px}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 20px 12px;background:var(--paper);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:-.01em}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.plabel{color:var(--dim)}
.topright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.savestate{font-size:11.5px;padding:3px 9px;border-radius:99px}
.savestate.saving{background:#EFF1EE;color:var(--dim)}
.savestate.saved{background:#E9F3EE;color:var(--green-d)}
.savestate.error{background:#FBF0EF;color:var(--red)}
.exportrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.progress b{font-variant-numeric:tabular-nums;font-weight:600}
.pbar{display:block;width:88px;height:5px;background:#DDE3DE;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);transition:width .3s ease}

.tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--line);
  position:sticky;top:52px;background:var(--paper);z-index:19}
.tabs.sub{position:static;padding:0;margin-bottom:18px}
.tab{background:none;border:none;padding:10px 14px;font-size:14px;color:var(--ink-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:400}
.tab.on{color:var(--green);border-bottom-color:var(--green);font-weight:600}

main{max-width:1080px;margin:0 auto;padding:20px 20px 80px}

/* \uD544\uD130 */
.filters{margin-bottom:18px}
.search{width:100%;max-width:420px;padding:9px 13px;border:1px solid var(--line);
  border-radius:7px;background:var(--card);font-size:14px;font-family:inherit;color:var(--ink)}
.search::placeholder{color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:5px 11px;border-radius:99px;font-size:12.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip-gap{width:1px;height:18px;background:var(--line);margin:0 5px}
.fieldpicker{margin-top:12px;padding:14px 16px;background:var(--card);
  border:1px solid var(--line);border-radius:9px}
.fieldpicker p{margin:0 0 10px;font-size:12.5px;line-height:1.5}
.fieldopts{display:flex;flex-wrap:wrap;gap:6px}
.fieldopt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--paper);border-radius:99px;padding:5px 12px;font-size:12.5px;
  color:var(--ink-2);cursor:pointer;user-select:none}
.fieldopt.on{background:#E9F3EE;border-color:#9EC6B2;color:var(--green-d)}
.fieldopt input{margin:0;accent-color:var(--green);width:13px;height:13px}
.card-note{font-style:italic;opacity:.85}

/* \uCE74\uB4DC */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{position:relative;display:flex;gap:13px;align-items:center;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px 12px 18px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#B9C4BD}
.rail{position:absolute;left:0;top:0;bottom:0;width:4px}
.pill-img{object-fit:contain;border-radius:5px;flex:none;background:#fff}
.glyph-wrap{display:flex;align-items:center;justify-content:center;flex:none}
.card-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.card-top{display:flex;align-items:center;gap:7px;min-width:0}
.card-name{font-weight:500;font-size:14.5px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.sdot{width:7px;height:7px;border-radius:50%;flex:none}
.imprint{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-2);
  letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imprint b{font-weight:500}
.imprint i{font-style:normal;color:var(--dim);margin:0 3px}
.mtag{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:500;flex:none}

/* \uC0C1\uC138 */
.sheet-bg{position:fixed;inset:0;background:rgba(20,33,28,.42);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  border-radius:14px 14px 0 0;padding:22px}
@media(min-width:640px){.sheet-bg{align-items:center;padding:24px}.sheet{border-radius:14px}}
.sheet-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.sheet-head h2{margin:0;font-size:19px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.sheet-head p{margin:3px 0 0;font-size:13px}
.officialname{font-size:12px!important;font-style:italic}
.x{border:none;background:none;font-size:16px;color:var(--dim);padding:4px 6px;line-height:1}
.sheet-head-actions{display:flex;align-items:center;gap:6px;flex:none}
.del{border:1px solid #E8CDCA;background:#FBF0EF;color:var(--red);font-size:12.5px;
  padding:6px 12px;border-radius:7px}
.confirm-del{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.mini-danger{background:var(--red);color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:12px}
.mini-ghost{background:none;border:1px solid var(--line);color:var(--ink-2);padding:5px 10px;border-radius:6px;font-size:12px}
.zoomable{border:none;background:none;padding:0;cursor:zoom-in;border-radius:8px}
.zoomable:hover{opacity:.85}
.lightbox{position:fixed;inset:0;background:rgba(20,33,28,.82);z-index:80;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.lightbox-x{position:absolute;top:18px;right:20px;background:none;border:none;
  color:#fff;font-size:22px;padding:8px;line-height:1}
.lightbox-cap{color:rgba(255,255,255,.75);font-size:13px}
.sheet-hero{display:flex;gap:18px;align-items:center;margin:18px 0;
  padding:16px;background:var(--paper);border-radius:10px}
.hero-side{display:flex;flex-direction:column;gap:9px;min-width:0}
.hero-imprint{font-size:15px}
.hero-imprint .imprint{font-size:15px}
.mrow{display:flex;gap:6px;flex-wrap:wrap}
.mrow.center{justify-content:center}
.mbtn,.sbtn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:5px 12px;border-radius:99px;font-size:12.5px}
.mbtn.on{color:#fff}
.sbtn.known.on{background:var(--green);border-color:var(--green);color:#fff}
.sbtn.unknown.on{background:var(--red);border-color:var(--red);color:#fff}
.spec{margin:0;display:grid;gap:0}
.spec>div{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:9px 2px;
  border-top:1px solid var(--line);font-size:13.5px}
.spec dt{color:var(--dim);margin:0}
.spec dd{margin:0;color:var(--ink);line-height:1.5}
.note{display:block;margin-top:18px}
.permit{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.permit h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.permit details{border-top:1px solid var(--line);padding:9px 0}
.permit details:first-of-type{border-top:none}
.permit summary{font-size:13.5px;font-weight:500;cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:6px}
.permit summary::before{content:"\u25B8";font-size:11px;color:var(--dim);transition:transform .12s}
.permit details[open] summary::before{transform:rotate(90deg)}
.permit summary::-webkit-details-marker{display:none}
.permit p{margin:8px 0 0;font-size:13px;line-height:1.65;color:var(--ink);white-space:pre-wrap}
.note span{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.note textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:13.5px;color:var(--ink);resize:vertical;line-height:1.5}

/* \uD034\uC988 */
.quiz-start{max-width:520px;margin:8px auto}
.quiz-start h2{font-size:18px;font-weight:600;margin:0 0 20px}
.opt-block{margin-bottom:22px}
.opt-label{display:block;font-size:12.5px;color:var(--dim);margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.opt.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.opt b{font-size:14.5px;font-weight:500}
.opt span{font-size:12.5px;color:var(--ink-2)}

.primary{background:var(--green);color:#fff;border:none;padding:10px 20px;
  border-radius:8px;font-size:14px;font-weight:500}
.primary:hover{background:var(--green-d)}
.primary:disabled{background:#C3CCC7;cursor:not-allowed}
.primary.big{width:100%;padding:14px;font-size:15px}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  padding:9px 16px;border-radius:8px;font-size:13.5px}
.ghost.warn{color:var(--red);border-color:#E8CDCA}

.quiz{max-width:560px;margin:0 auto}
.qbar{margin-bottom:18px}
.qprog{height:4px;background:#DDE3DE;border-radius:99px;overflow:hidden}
.qprog span{display:block;height:100%;background:var(--green);transition:width .25s}
.qbar-meta{display:flex;justify-content:space-between;align-items:center;
  margin-top:7px;font-size:12.5px;color:var(--dim)}
.quit{background:none;border:none;color:var(--dim);font-size:12.5px;text-decoration:underline;padding:0}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.qimg{display:flex;justify-content:center;padding:14px 0 18px}
.qhint{display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:13px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.qhint .imprint{font-size:15px;color:var(--ink)}
.reveal{text-align:center;margin-bottom:20px}
.reveal h3{margin:0 0 5px;font-size:19px;font-weight:600;line-height:1.35}
.reveal p{margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.rnote{margin-top:10px!important;padding:9px 12px;background:var(--paper);
  border-radius:7px;font-size:13px;text-align:left}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge.single{grid-template-columns:1fr}
.jbtn{padding:14px;border-radius:8px;font-size:15px;font-weight:500;border:1px solid}
.jbtn.no{background:#FBF0EF;border-color:#EBD2CF;color:var(--red)}
.jbtn.yes{background:var(--green);border-color:var(--green);color:#fff}
.qname{text-align:center;margin-bottom:20px}
.qname h3{margin:0;font-size:18px;font-weight:600;line-height:1.35}
.qname p{margin:4px 0 0;font-size:13px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.choice{background:var(--paper);border:1px solid var(--line);border-radius:9px;
  padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:7px}
.choice.right{border-color:var(--green);background:#E9F3EE;box-shadow:inset 0 0 0 1px var(--green)}
.choice.wrong{border-color:var(--red);background:#FBF0EF;box-shadow:inset 0 0 0 1px var(--red)}
.choice.faded{opacity:.45}
.cimp{font-size:11.5px}
.quiz-done{text-align:center;padding:60px 20px}
.quiz-done h2{font-size:20px;font-weight:600;margin:0 0 10px}
.score{font-size:15px;margin:0 0 24px}
.score i{font-style:normal;color:var(--dim);margin:0 10px}

/* \uD638\uAE30 */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 0 8px}
.col header{display:flex;align-items:baseline;gap:8px;padding:12px 16px 10px;
  border-bottom:2px solid;margin:0 12px}
.col h3{margin:0;font-size:14px;font-weight:600}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.col ul{list-style:none;margin:0;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.col li{display:flex;align-items:center;gap:6px;border-radius:7px;padding:2px 4px}
.col li:hover{background:var(--paper)}
.col-empty{color:var(--dim);font-size:13px;padding:14px 10px!important;justify-content:center}
.row-open{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;
  padding:5px 4px;text-align:left;min-width:0}
.row-name{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-moves{display:flex;gap:2px;flex:none}
.move{width:26px;height:26px;border:1px solid var(--line);background:var(--card);
  border-radius:6px;font-size:12px;font-weight:600;line-height:1}
.move:hover{border-color:currentColor}

/* \uBD88\uB7EC\uC624\uAE30 */
.import{max-width:620px;margin:0 auto}
.pane{display:flex;flex-direction:column;gap:12px}
.lead{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.pane textarea,.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13.5px;
  color:var(--ink);background:var(--card);resize:vertical;line-height:1.5}
.pane textarea{font-family:'IBM Plex Mono',monospace;font-size:12px}
.fld{display:block}
.fld>span{display:block;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.fld code{font-family:'IBM Plex Mono',monospace;background:var(--paper);padding:1px 4px;border-radius:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.import .primary,.import .ghost{align-self:flex-start}
.msg{font-size:13px;padding:10px 13px;border-radius:8px;margin:0 0 14px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.msg.ok{background:#E9F3EE;color:var(--green-d)}
.msg.no{background:#FBF0EF;color:var(--red)}
.danger{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
  font-size:13px;color:var(--dim)}
.danger span{flex:1;min-width:0}
.fillrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
.fillrow b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.fillrow span{font-size:12.5px;color:var(--ink-2)}
.reviewbox{margin-top:18px;padding:14px 16px;background:#FBF6EC;border:1px solid #EAD9A8;border-radius:9px}
.reviewbox h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:#8A6A1F}
.reviewbox ul{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
.reviewbox li{display:flex;flex-direction:column;gap:2px;font-size:13px}
.reviewbox li span{color:var(--ink-2);font-size:12px}
.reviewbox li.resolved{opacity:.7}
.reviewbox .rline{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.reviewbox .picked{color:var(--green-d);font-size:13px}
.ghost.small{padding:5px 11px;font-size:12px;align-self:flex-start;margin:2px 0 8px}
.candlist{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;
  padding:8px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.candbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;
  text-align:left;background:none;border:none;border-radius:6px;padding:7px 9px}
.candbtn:hover{background:var(--paper)}
.candbtn .cname{font-size:13px;color:var(--ink)}
.candbtn .centp{font-size:11.5px;color:var(--dim);flex:none}
.testrow{margin:4px 0 18px}
.apidivider{display:flex;align-items:center;gap:10px;margin:26px 0 14px;
  font-size:12.5px;font-weight:600;color:var(--ink-2)}
.apidivider::after{content:"";flex:1;height:1px;background:var(--line)}


/* \uBC30\uCE58\uB3C4 */
.boardwrap{max-width:100%}
.board-lead{margin:12px 0 20px}
.cabinet{margin-bottom:24px}
.cabinet h4{margin:0 0 8px;font-size:12.5px;font-weight:500;color:var(--dim)}
.cols{display:grid;gap:4px}
.colstack{display:flex;flex-direction:column;gap:4px}
.slot{position:relative;display:flex;flex-direction:column;justify-content:flex-start;
  gap:2px;border:1px solid;border-radius:5px;padding:5px 5px 6px;min-height:46px;
  text-align:left;overflow:hidden;transition:box-shadow .12s}
.slot:hover{box-shadow:0 0 0 2px rgba(14,107,75,.18)}
.snum{font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.75;line-height:1}
.sname{font-size:10.5px;line-height:1.25;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slot.filled .sname{color:var(--ink)}
.slotbadge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;flex:none}
.tray{margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.tray h4{margin:0 0 10px;font-size:12.5px;font-weight:500;color:var(--dim)}
.traylist{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.traychip{border:1px solid var(--line);background:var(--card);border-radius:99px;
  padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.traychip.on{background:var(--green);border-color:var(--green);color:#fff}
.bigslot{font-size:26px!important;font-weight:600;margin:6px 0 0!important;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
@media(max-width:640px){
  .cols{gap:3px}.slot{min-height:40px;padding:4px}
  .sname{font-size:9.5px;-webkit-line-clamp:2}
}

.empty{text-align:center;padding:70px 20px;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty h3{margin:10px 0 0;font-size:16px;font-weight:600}
.empty p{margin:0 0 14px;font-size:13.5px;color:var(--ink-2);max-width:340px;line-height:1.6}
